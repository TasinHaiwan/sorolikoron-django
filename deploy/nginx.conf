# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sorolikoron
# certbot adds the HTTPS (443) block to this file automatically.
server {
    listen 80;
    server_name api.sorolikoron.com;

    client_max_body_size 10M;

    location /static/ {
        alias /srv/sorolikoron/staticfiles/;
    }

    location /media/ {
        alias /srv/sorolikoron/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
